name: ClearCut CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clearcut-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: JVM, package, native, and release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API and build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;35.0.0" "platform-tools"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run repository contract self-tests
        shell: bash
        run: |
          python scripts/check_16kb_alignment.py --self-test
          python scripts/check_apk_size.py --self-test
          python scripts/release_identity.py --self-test
          python scripts/validate_android_audio_api_policy.py --self-test
          python scripts/validate_distribution_readiness.py --self-test
          python scripts/validate_package_identity.py --self-test
          python scripts/validate_public_claims.py --self-test
          python scripts/verify_native_supply_chain.py --self-test
          python scripts/verify_otio_exports.py --self-test
          python scripts/verify_release_artifacts.py --self-test
          python scripts/write_apk_signing_fingerprints.py --self-test
          python scripts/write_release_checksums.py --self-test
          python scripts/write_ci_provenance.py --self-test

      - name: Validate source contracts
        shell: bash
        run: |
          python scripts/generate_capability_registry.py --check
          python scripts/release_identity.py
          python scripts/validate_package_identity.py
          python scripts/validate_public_claims.py
          python scripts/validate_android_audio_api_policy.py
          python scripts/verify_native_supply_chain.py

      - name: Run JVM, lint, QA, and debug build gates
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew \
            :app:testQaUnitTest \
            :app:lintDebug \
            :app:assembleQa \
            :app:assembleQaAndroidTest \
            :app:assembleDebug \
            :app:generateNativeSbom \
            :app:verifyResolvedAdvisoryFloors \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Verify every packaged APK is 16 KB aligned
        shell: bash
        run: |
          find app/build/outputs/apk -type f -name '*.apk' -print0 \
            | xargs -0 -r -n 1 python scripts/check_16kb_alignment.py

      - name: Write deterministic checksums and provenance
        shell: bash
        env:
          CLEARCUT_SOURCE_REVISION: ${{ github.sha }}
        run: |
          python scripts/write_release_checksums.py --root "$GITHUB_WORKSPACE/app/build/outputs/apk"
          python scripts/write_apk_signing_fingerprints.py --root "$GITHUB_WORKSPACE/app/build/outputs/apk"
          python scripts/write_ci_provenance.py \
            --artifact-root app/build/outputs/apk \
            --report-dir app/build/reports/ci-provenance \
            --evidence-file app/build/reports/native-sbom/cyclonedx.json \
            --evidence-file app/build/reports/native-sbom/spdx.json \
            --evidence-file app/build/reports/resolved-sbom/cyclonedx.json \
            --evidence-file app/build/reports/runtime-notices/runtime-notices.json \
            --source-revision "$GITHUB_SHA" \
            --workflow "$GITHUB_WORKFLOW" \
            --event "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --job "$GITHUB_JOB"

      - name: Upload build evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: clearcut-ci-evidence-${{ github.run_id }}
          if-no-files-found: error
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/apk/**/*.json
            app/build/outputs/apk/**/*.sha256
            app/build/outputs/apk/**/*.signing-cert-sha256
            app/build/reports/ci-provenance/**
            app/build/reports/native-sbom/**
            app/build/reports/resolved-sbom/**
            app/build/reports/runtime-notices/**
